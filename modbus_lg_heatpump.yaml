# Home Assistant LG Heatpump integration
# last update: 2025-11-10
# validated for Home Assistant 2025.11+

modbus:
  - name: "lg_heatpump"
    type: tcp
    host: !secret lg_heatpump_modbus_host_ip
    port: !secret lg_heatpump_modbus_port

    sensors:
      # --- Input Registers ---
      - name: "hp_error_code"
        unique_id: "modbus.hp_error_code"
        address: 0
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_odu_operation_cycle"
        unique_id: "modbus.hp_odu_operation_cycle"
        address: 1
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_inlet_temp"
        unique_id: "modbus.hp_inlet_temp"
        address: 2
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_outlet_temp"
        unique_id: "modbus.hp_outlet_temp"
        address: 3
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_backup_heater_outlet_temp"
        unique_id: "modbus.hp_backup_heater_outlet_temp"
        address: 4
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_dhw_water_temp"
        unique_id: "modbus.hp_dhw_water_temp"
        address: 5
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_solar_collector_temp"
        unique_id: "modbus.hp_solar_collector_temp"
        address: 6
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_temp_technikraum"
        unique_id: "modbus.hp_temp_technikraum"
        address: 7
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_flow_rate"
        unique_id: "modbus.hp_flow_rate"
        address: 8
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "l/min"
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_flow_temp_circle_2"
        unique_id: "modbus.hp_flow_temp_circle_2"
        address: 9
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2_input"
        unique_id: "modbus.hp_room_air_temp_circuit2_input"
        address: 10
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_energy_state_input"
        unique_id: "modbus.hp_energy_state_input"
        address: 11
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_outside_temp"
        unique_id: "modbus.hp_outside_temp"
        address: 12
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      # --- Holding Registers ---
      - name: "hp_operation_mode"
        unique_id: "modbus.hp_operation_mode"
        address: 0
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 60

      - name: "hp_control_method"
        unique_id: "modbus.hp_control_method"
        address: 1
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 60

      - name: "hp_target_temp_circuit1"
        unique_id: "modbus.hp_target_temp_circuit1"
        address: 2
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_shift_value_in_auto_mode_circuit1"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit1"
        address: 4
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        data_type: int16
        precision: 1
        scan_interval: 30

      - name: "hp_target_temp_circuit2"
        unique_id: "modbus.hp_target_temp_circuit2"
        address: 5
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_shift_value_in_auto_mode_circuit2"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit2"
        address: 7
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        data_type: int16
        precision: 1
        scan_interval: 30

      - name: "hp_dhw_target_temp"
        unique_id: "modbus.hp_dhw_target_temp"
        address: 8
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_energy_state_input_raw"
        unique_id: "modbus.hp_energy_state_input_raw"
        address: 9
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 10

template:
  - binary_sensor:
      - name: "HP Energy State - Nicht verwenden"
        unique_id: "hp_energy_state_nicht_verwenden"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 0 }}"

      - name: "HP Energy State - Erzwungen Aus"
        unique_id: "hp_energy_state_erzwungen_aus"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 1 }}"

      - name: "HP Energy State - Normalbetrieb"
        unique_id: "hp_energy_state_normalbetrieb"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 2 }}"

      - name: "HP Energy State - Ein-Empfehlung"
        unique_id: "hp_energy_state_ein_empfehlung"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 3 }}"

      - name: "HP Energy State - Ein-Befehl"
        unique_id: "hp_energy_state_ein_befehl"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 4 }}"

      - name: "HP Energy State - Ein-Befehl Schritt 2"
        unique_id: "hp_energy_state_ein_befehl_schritt_2"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 5 }}"

      - name: "HP Energy State - Ein-Empfehlung Schritt 1"
        unique_id: "hp_energy_state_ein_empfehlung_befehl_schritt_1"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 6 }}"

      - name: "HP Energy State - Energiesparmodus"
        unique_id: "hp_energy_state_ein_energiesparmodus"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 7 }}"

      - name: "HP Energy State - Superenergiesparmodus"
        unique_id: "hp_energy_state_ein_superenergiesparmodus"
        state: "{{ states('sensor.hp_energy_state_input_raw')|int(default=0) == 8 }}"

automation:
  - id: "hp_automation_set_shift_value_in_auto_mode_circuit1_input_slider_update"
    alias: "Shift Value HK1 Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_shift_value_in_auto_mode_circuit1
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_shift_value_in_auto_mode_circuit1
        data:
          value: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit1') }}"

  - id: "hp_automation_set_shift_value_in_auto_mode_circuit2_input_slider_update"
    alias: "Shift Value HK2 Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_shift_value_in_auto_mode_circuit2
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_shift_value_in_auto_mode_circuit2
        data:
          value: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit2') }}"

  - id: "hp_automation_set_target_temperatur_input_slider_update"
    alias: "DHW Zieltemperatur Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_dhw_target_temp
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_dhw_target_temperatur
        data:
          value: "{{ states('sensor.hp_dhw_target_temp') }}"
